{{- if gt (int .Values.app.replicaCount) 1 }}
# Voluntary disruptions (node drain, cluster upgrade) keep at least one app
# pod running.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "fskick.fullname" . }}
  labels:
    {{- include "fskick.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "fskick.selectorLabels" (dict "ctx" . "component" "app") | nindent 6 }}
{{- end }}
