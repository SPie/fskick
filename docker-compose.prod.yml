name: fskick-prod

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EVENT_STORE_DB: ${EVENT_STORE_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./priv/postgres/init-eventstore-db.sh:/docker-entrypoint-initdb.d/init-eventstore-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    command: ["/app/bin/migrate"]
    environment:
      DATABASE_URL: ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      EVENT_STORE_URL: ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${EVENT_STORE_DB}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST}
      # runtime.exs requires these in every prod release command, migrations included.
      MAIL_API_KEY: ${MAIL_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment:
      DATABASE_URL: ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${POSTGRES_DB}
      EVENT_STORE_URL: ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/${EVENT_STORE_DB}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      PHX_HOST: ${PHX_HOST}
      MAIL_API_KEY: ${MAIL_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      APP_VERSION: ${APP_VERSION:-dev}
      PORT: 4000
    ports:
      - ${HOST_PORT:-4000}:4000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
